name: 🐛 Bug Report
description: Report a problem with a skill in this repository
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please fill in as much detail as possible to help us resolve the issue quickly.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill is affected?
      placeholder: e.g. candid-video-prompts
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is the problem?
      placeholder: Describe what happens versus what you expected...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How did you encounter the bug?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Open WebUI Version
      description: Which version of Open WebUI are you using?
      placeholder: e.g. v0.5.0
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information, screenshots, or examples.
    validations:
      required: false